runtime: container
build:
  dockerfile: Dockerfile
  dockerBuildPath: .
startCommand:
  type: http
  env:
    TRANSPORT: http
  configSchema:
    type: object
    properties:
      defaultUrl:
        type: string
        title: 'Default URL'
        description: 'Default URL to open with the new_page_default tool (optional)'
      browseruse:
        type: object
        title: 'BrowserUse Configuration'
        description: 'Configure BrowserUse as your remote browser provider'
        properties:
          apiKey:
            type: string
            title: 'API Key'
            description: 'Your BrowserUse API key'
          proxyCountryCode:
            type: string
            title: 'Proxy Country Code'
            description: 'Optional proxy country code (e.g., US, GB, DE)'
          profileId:
            type: string
            title: 'Profile ID'
            description: 'Optional browser profile ID for persistent sessions'
          timeout:
            type: number
            title: 'Timeout (minutes)'
            description: 'Browser session timeout in minutes (default: 15)'
        required: ['apiKey']
    required: ['browseruse']
  commandFunction: |
    (config) => {
      const env = {
        TRANSPORT: 'http',
      };

      if (config.defaultUrl) {
        env.MCP_DEFAULT_URL = config.defaultUrl;
      }

      // BrowserUse configuration
      if (config.browseruse?.apiKey) {
        env.BROWSERUSE_API_KEY = config.browseruse.apiKey;
      }
      if (config.browseruse?.proxyCountryCode) {
        env.BROWSERUSE_PROXY_COUNTRY_CODE = config.browseruse.proxyCountryCode;
      }
      if (config.browseruse?.profileId) {
        env.BROWSERUSE_PROFILE_ID = config.browseruse.profileId;
      }
      if (config.browseruse?.timeout) {
        env.BROWSERUSE_TIMEOUT = config.browseruse.timeout.toString();
      }

      return {
        command: 'node',
        args: ['build/src/index.js'],
        env,
      };
    }
exampleConfig:
  defaultUrl: 'https://example.com'
  browseruse:
    apiKey: 'bu_xxx'  # Provide via Test Profile
    # proxyCountryCode: 'US'  # Optional
    # profileId: 'profile_123'  # Optional
    # timeout: 15  # Optional (minutes)
