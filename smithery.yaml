runtime: container
build:
  dockerfile: Dockerfile
  dockerBuildPath: .
startCommand:
  type: http
  env:
    TRANSPORT: http
  configSchema:
    type: object
    additionalProperties: false
    oneOf:
      - title: 'Browserbase Provider'
        required: ['browserbase']
        properties:
          defaultUrl:
            type: string
            description: 'Default URL to open with the new_page_default tool.'
          browserbase:
            type: object
            description: 'Browserbase remote session settings.'
            additionalProperties: false
            required: ['apiKey', 'projectId']
            properties:
              apiKey:
                type: string
                title: 'Browserbase API Key'
                description: 'Your Browserbase API key.'
              projectId:
                type: string
                title: 'Project ID'
                description: 'Browserbase Project ID.'
              contextId:
                type: string
                title: 'Context ID (Optional)'
                description: 'Optional persistent context id.'
              persist:
                type: boolean
                title: 'Persist Context'
                description: 'Persist the Browserbase context across runs.'
                default: true
      - title: 'BrowserUse Provider'
        required: ['browseruse']
        properties:
          defaultUrl:
            type: string
            description: 'Default URL to open with the new_page_default tool.'
          browseruse:
            type: object
            description: 'BrowserUse remote session settings.'
            additionalProperties: false
            required: ['apiKey']
            properties:
              apiKey:
                type: string
                title: 'BrowserUse API Key'
                description: 'Your BrowserUse API key.'
  commandFunction: |
    (config) => {
      const env = {
        TRANSPORT: 'http',
        ...(config.defaultUrl ? { MCP_DEFAULT_URL: config.defaultUrl } : {}),
      };

      // Check which provider is configured (oneOf ensures only one exists)
      if (config.browseruse) {
        // BrowserUse configuration
        const bu = config.browseruse;
        if (bu.apiKey) env.BROWSERUSE_API_KEY = bu.apiKey;
      } else if (config.browserbase) {
        // Browserbase configuration
        const bb = config.browserbase;
        if (bb.apiKey) env.BROWSERBASE_API_KEY = bb.apiKey;
        if (bb.projectId) env.BROWSERBASE_PROJECT_ID = bb.projectId;
        if (bb.contextId) env.BROWSERBASE_CONTEXT_ID = bb.contextId;
        if (bb.persist !== undefined) env.BROWSERBASE_PERSIST = String(!!bb.persist);
      }

      return {
        command: 'node',
        args: ['build/src/index.js'],
        env,
      };
    }
exampleConfig:
  # Option 1: Browserbase (default)
  defaultUrl: 'https://example.com'
  browserbase:
    # Provide apiKey and projectId via Test Profile or secret store
    persist: true

  # Option 2: BrowserUse (uncomment to use instead)
  # defaultUrl: 'https://example.com'
  # browseruse:
  #   # Provide apiKey via Test Profile or secret store
