runtime: container
build:
  dockerfile: Dockerfile
  dockerBuildPath: .
startCommand:
  type: http
  env:
    TRANSPORT: http
  configSchema:
    type: object
    additionalProperties: false
    required: ['provider']
    properties:
      provider:
        type: string
        enum: ['browserbase', 'browseruse']
        description: 'Choose which remote browser provider to use.'
        default: 'browserbase'
      defaultUrl:
        type: string
        description: 'Default URL to open with the new_page_default tool.'
      browserbase:
        type: object
        description: 'Browserbase remote session settings (only used when provider is "browserbase").'
        additionalProperties: false
        properties:
          apiKey:
            type: string
            description: 'Browserbase API key.'
          projectId:
            type: string
            description: 'Browserbase Project ID.'
          contextId:
            type: string
            description: 'Optional persistent context id.'
          persist:
            type: boolean
            description: 'Persist the Browserbase context across runs.'
            default: true
          mcpCli:
            type: string
            description: 'Optional override path to MCP entrypoint (advanced).'
      browseruse:
        type: object
        description: 'BrowserUse remote session settings (only used when provider is "browseruse").'
        additionalProperties: false
        properties:
          apiKey:
            type: string
            description: 'BrowserUse API key.'
          mcpCli:
            type: string
            description: 'Optional override path to MCP entrypoint (advanced).'
  commandFunction: |
    (config) => {
      const provider = config.provider || 'browserbase';
      const bb = config.browserbase || {};
      const bu = config.browseruse || {};

      const env = {
        TRANSPORT: 'http',
        ...(config.defaultUrl ? { MCP_DEFAULT_URL: config.defaultUrl } : {}),
      };

      if (provider === 'browseruse') {
        // BrowserUse configuration
        if (bu.apiKey) env.BROWSERUSE_API_KEY = bu.apiKey;
      } else {
        // Browserbase configuration
        if (bb.apiKey) env.BROWSERBASE_API_KEY = bb.apiKey;
        if (bb.projectId) env.BROWSERBASE_PROJECT_ID = bb.projectId;
        if (bb.contextId) env.BROWSERBASE_CONTEXT_ID = bb.contextId;
        if (bb.persist !== undefined) env.BROWSERBASE_PERSIST = String(!!bb.persist);
      }

      return {
        command: 'node',
        args: ['build/src/index.js'],
        env,
      };
    }
exampleConfig:
  # Choose your provider
  provider: 'browserbase'  # or 'browseruse'
  defaultUrl: 'https://example.com'

  # If provider is 'browserbase':
  browserbase:
    # Provide apiKey and projectId via Test Profile or secret store
    persist: true

  # If provider is 'browseruse':
  # browseruse:
  #   # Provide apiKey via Test Profile or secret store
