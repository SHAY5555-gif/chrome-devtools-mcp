runtime: container
build:
  dockerfile: Dockerfile
  dockerBuildPath: .
startCommand:
  type: http
  env:
    TRANSPORT: http
  configSchema:
    type: object
    properties:
      defaultUrl:
        type: string
        title: 'Default URL'
        description: 'Default URL to open with the new_page_default tool (optional)'
      browseruse:
        type: object
        title: 'BrowserUse Configuration'
        description: 'Configure BrowserUse as your remote browser provider'
        properties:
          apiKey:
            type: string
            title: 'API Key'
            description: 'Your BrowserUse API key'
        required: ['apiKey']
    required: ['browseruse']
  commandFunction: |
    (config) => {
      const env = {
        TRANSPORT: 'http',
      };

      if (config.defaultUrl) {
        env.MCP_DEFAULT_URL = config.defaultUrl;
      }

      // BrowserUse configuration
      if (config.browseruse?.apiKey) {
        env.BROWSERUSE_API_KEY = config.browseruse.apiKey;
      }

      return {
        command: 'node',
        args: ['build/src/index.js'],
        env,
      };
    }
exampleConfig:
  defaultUrl: 'https://example.com'
  browseruse:
    apiKey: 'bu_xxx'  # Provide via Test Profile
